quick_start: |
  ```hcl
  route53_resolver_parameters = {
    # Hybrid DNS over Site-to-Site VPN / Transit Gateway.
    # Place both endpoints in private subnets that already route to on-premises.
    #
    # Outbound: AWS → on-premises. Workloads in vpc-01 (and RAM-shared spokes)
    # resolve corp.example.com against on-premises DNS.
    "vpn-01-outbound" = {
      vpc        = "vpc-01"
      subnet_ids = ["private-a", "private-b"]
      direction  = "OUTBOUND" # Default: "OUTBOUND"

      rules = {
        "onprem" = {
          domain_name = "corp.example.com"
          rule_type   = "FORWARD" # Default: "FORWARD"
          # Replace with the on-premises DNS server IP(s) reachable over VPN / TGW.
          target_ips = ["172.0.0.1", "172.0.0.2"]
        }
      }

      ## Share FORWARD rules with the organization, or with specific account IDs
      ram_share_with_organization = true # Default: false
      # share_rules    = true # Default: false
      # ram_principals = [
      #   "123456789012",
      #   "234567890123"
      # ]
      # ram_allow_external_principals = false # Default: false
      # ram_name                      = null
    }

    # Inbound: on-premises → AWS. On-premises resolvers query this endpoint so
    # they can resolve private hosted zones in AWS. No FORWARD rules — inbound
    # creates the endpoint because direction is INBOUND. After apply, give the
    # inbound ENI IPs (resolver_endpoint_ip_addresses) to on-premises DNS as forwarders.
    "vpn-01-inbound" = {
      vpc        = "vpc-01"
      subnet_ids = ["private-a", "private-b"]
      direction  = "INBOUND" # Default: "OUTBOUND"
      # Optional: inbound already implies create_endpoint = true when rules is empty.
      # create_endpoint = true

      # Networks allowed to query this endpoint on TCP/UDP 53 (on-premises CIDRs).
      ingress_cidr_blocks = [
        "172.0.0.0/16"
      ]
    }

    # Same hub using AWS resource IDs instead of wrapper keys:
    # "vpn-01-outbound-by-id" = {
    #   resource_ids = {
    #     vpc_id     = "vpc-01xxxxxxxxxxxxx"
    #     subnet_ids = ["subnet-01xxxxxxxxxxxxx", "subnet-02xxxxxxxxxxxxx"]
    #   }
    #   direction = "OUTBOUND"
    #   rules = {
    #     "onprem" = {
    #       domain_name = "corp.example.com"
    #       target_ips  = ["172.0.0.1"]
    #     }
    #   }
    # }

    # Spoke VPC: attach a rule already shared via RAM. No endpoint, rules, or RAM share.
    "shared-onprem" = {
      vpc = "vpc-01"
      shared_rules = {
        "onprem" = "rslvr-rr-01xxxxxxxxxxxxx"
      }
      # Lookup by rule name or domain instead of ID:
      # rule_associations = {
      #   "onprem" = { rule_name = "onprem" }
      #   # "onprem" = { domain_name = "corp.example.com" }
      #   # "onprem" = { resource_id = "rslvr-rr-01xxxxxxxxxxxxx" }
      # }
      # If the RAM invite is not auto-accepted:
      # accept_resource_share  = true # Default: false
      # ram_resource_share_arn = "arn:aws:ram:us-east-2:123456789012:resource-share/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    }
  }
  ```
features:
  - icon: 🛰️
    title: Outbound forwarding to on-premises DNS
    short_description: Resolver endpoint in the hub VPC with FORWARD rules targeting on-premises IPs reachable over VPN or Transit Gateway
    long_description: |
      Create an OUTBOUND endpoint in private subnets that already have a route to on-premises networks (Site-to-Site VPN, TGW). Each rule in `rules` forwards a domain to one or more target IPs (`ip`, `ip:port`, or `{ ip, port }`). The wrapper associates the rules with the endpoint VPC by default (`associate_vpc = true`). An OUTBOUND endpoint is created only when `rules` is non-empty (or `create_endpoint = true`). At least two subnets in different AZs are required.
    examples:
      - title: Forward a corporate domain to on-premises DNS
        code: |
          ```hcl
          route53_resolver_parameters = {
            "onprem" = {
              vpc        = "vpc-01"
              subnet_ids = ["private-a", "private-b"]
              direction  = "OUTBOUND"
              rules = {
                "corp" = {
                  domain_name = "corp.example.com"
                  target_ips  = ["172.0.0.1", "172.0.0.2"]
                }
              }
            }
          }
          ```
  - icon: 🔄
    title: Hybrid DNS over Site-to-Site VPN
    short_description: Pair an OUTBOUND and an INBOUND endpoint so AWS and on-premises can resolve each other's private domains
    long_description: |
      Bidirectional hybrid DNS needs two endpoints in the same private subnets that already route over Site-to-Site VPN and Transit Gateway. OUTBOUND is AWS → on-premises: workloads (and RAM-shared spokes) forward `corp.example.com` to on-premises DNS IPs on the far side of the tunnel. INBOUND is on-premises → AWS: on-premises resolvers query the inbound ENIs so they can resolve private hosted zones in AWS. INBOUND does not use `rules`; `direction = "INBOUND"` creates the endpoint. Restrict `ingress_cidr_blocks` to the on-premises CIDRs — an INBOUND security group does not default to `0.0.0.0/0`. After apply, configure on-premises DNS to forward AWS private zones to `resolver_endpoint_ip_addresses["vpn-01-inbound"]`. RAM shares only the outbound FORWARD rules, not the inbound endpoint.
    examples:
      - title: Outbound (AWS resolves on-premises domains)
        code: |
          ```hcl
          route53_resolver_parameters = {
            "vpn-01-outbound" = {
              vpc        = "vpc-01"
              subnet_ids = ["private-a", "private-b"]
              direction  = "OUTBOUND"
              rules = {
                "onprem" = {
                  domain_name = "corp.example.com"
                  target_ips  = ["172.0.0.1", "172.0.0.2"]
                }
              }
              ram_share_with_organization = true
            }
          }
          ```
      - title: Inbound (on-premises resolves AWS private zones)
        code: |
          ```hcl
          route53_resolver_parameters = {
            "vpn-01-inbound" = {
              vpc                 = "vpc-01"
              subnet_ids          = ["private-a", "private-b"]
              direction           = "INBOUND"
              ingress_cidr_blocks = ["172.0.0.0/16"]
            }
          }
          ```
  - icon: 🗺️
    title: VPC and subnet resolution
    short_description: Resolve vpc_id and subnet_ids from AWS IDs, wrapper-vpc keys, or Name-tag data sources
    long_description: |
      Standard Platform `modules/base` injects `vpc_parameter = module.wrapper_vpc` automatically (same as peering, TGW, VPN, and Route 53 zones). Set `vpc` and `subnet_ids` to wrapper keys — do not pass `vpc_parameter` from the workspace. First match wins: (1) AWS resource IDs via `vpc_id` / `subnet_ids` or `resource_ids`; (2) wrapper keys `vpc = "vpc-01"` and `subnet_ids = ["private-a"]` → `vpcs["vpc-01"].vpc_id` and `subnets["vpc-01-private-a"].id` (full keys such as `"vpc-01-private-a"` also work; if `subnet_ids` is omitted, every `vpc-01-private-*` subnet is used); (3) Name tags via `vpc_name` / `subnet_name` (same `data.aws_vpc` / `data.aws_subnets` pattern as RDS and ECS). `vpc-01` is a map key, not an AWS VPC ID (IDs are `vpc-` plus 8 or 17 hex characters). Individual `subnet_ids` values that are not IDs and not wrapper keys are looked up with `data.aws_subnet` by `tag:Name`.
    examples:
      - title: Wrapper-vpc keys (injected by Standard Platform)
        code: |
          ```hcl
          route53_resolver_parameters = {
            "onprem" = {
              vpc        = "vpc-01"
              subnet_ids = ["private-a", "private-b"]
            }
          }
          ```
      - title: AWS resource IDs
        code: |
          ```hcl
          route53_resolver_parameters = {
            "onprem" = {
              resource_ids = {
                vpc_id     = "vpc-01xxxxxxxxxxxxx"
                subnet_ids = ["subnet-01xxxxxxxxxxxxx", "subnet-02xxxxxxxxxxxxx"]
              }
            }
          }
          ```
      - title: Name-tag data sources
        code: |
          ```hcl
          route53_resolver_parameters = {
            "onprem" = {
              vpc_name    = "acme-prd"
              subnet_name = "acme-prd-private*"
            }
          }
          ```
  - icon: 🔗
    title: RAM sharing of resolver rules
    short_description: Share FORWARD rules with the organization or with account IDs so spoke VPCs can resolve the same domains
    long_description: |
      AWS RAM shares the resolver rules, not the endpoint. Who receives them: `ram_share_with_organization = true` looks up this account's organization ARN (implies `share_rules = true`), and/or `share_rules = true` with `ram_principals` (account IDs, OU ARNs, or an org ARN). Both can be set together. In the consumer account, pass only `vpc` plus `shared_rules` (or `rule_associations`) — no endpoint, rules, or RAM share when `rules` is empty. Shared rules resolve like VPC resources: `rslvr-rr-…` / `resource_id`, `rule_name`, or `domain_name`. Enable RAM sharing with AWS Organizations in the management account so intra-org shares are auto-accepted. If the invite is not auto-accepted, set `accept_resource_share = true` and `ram_resource_share_arn`.
    examples:
      - title: Share rules with the whole organization
        code: |
          ```hcl
          route53_resolver_parameters = {
            "onprem" = {
              vpc        = "vpc-01"
              subnet_ids = ["private-a", "private-b"]
              rules = {
                "corp" = {
                  domain_name = "corp.example.com"
                  target_ips  = ["172.0.0.1"]
                }
              }
              ram_share_with_organization = true
            }
          }
          ```
      - title: Share rules with specific account IDs
        code: |
          ```hcl
          route53_resolver_parameters = {
            "onprem" = {
              vpc        = "vpc-01"
              subnet_ids = ["private-a", "private-b"]
              rules = {
                "corp" = {
                  domain_name = "corp.example.com"
                  target_ips  = ["172.0.0.1"]
                }
              }
              share_rules    = true
              ram_principals = ["123456789012", "234567890123"]
            }
          }
          ```
      - title: Associate a shared rule in a spoke VPC (by ID)
        code: |
          ```hcl
          route53_resolver_parameters = {
            "shared-onprem" = {
              vpc = "vpc-01"
              shared_rules = {
                "corp" = "rslvr-rr-01xxxxxxxxxxxxx"
              }
            }
          }
          ```
      - title: Associate a shared rule by name or domain
        code: |
          ```hcl
          route53_resolver_parameters = {
            "shared-onprem" = {
              vpc = "vpc-01"
              rule_associations = {
                "corp" = {
                  rule_name = "corp"
                  # domain_name = "corp.example.com"
                  # resource_id = "rslvr-rr-01xxxxxxxxxxxxx"
                }
              }
            }
          }
          ```
  - icon: 🛡️
    title: Security group for DNS to on-premises
    short_description: Auto-created security group allowing TCP/UDP 53 toward rule target IPs
    long_description: |
      When `create_security_group = true` (default when an endpoint is created), the wrapper creates a security group on the endpoint. OUTBOUND endpoints egress TCP/UDP 53 to the rule target IPs (or `egress_cidr_blocks`). INBOUND endpoints allow TCP/UDP 53 from `ingress_cidr_blocks` only — empty ingress is rejected rather than opened to `0.0.0.0/0`. Pass extra IDs with `security_group_ids`.
    examples:
      - title: Restrict egress to on-premises DNS CIDRs
        code: |
          ```hcl
          route53_resolver_parameters = {
            "onprem" = {
              vpc                = "vpc-01"
              subnet_ids         = ["private-a", "private-b"]
              egress_cidr_blocks = ["172.0.0.1/32", "172.0.0.2/32"]
              rules = {
                "corp" = {
                  domain_name = "corp.example.com"
                  target_ips  = ["172.0.0.1", "172.0.0.2"]
                }
              }
            }
          }
          ```
      - title: Restrict inbound queries to on-premises CIDRs
        code: |
          ```hcl
          route53_resolver_parameters = {
            "vpn-01-inbound" = {
              vpc                 = "vpc-01"
              subnet_ids          = ["private-a", "private-b"]
              direction           = "INBOUND"
              ingress_cidr_blocks = ["172.0.0.0/16"]
            }
          }
          ```
important_notes: |
  - ⚠️ **Connectivity**: The endpoint subnets must already route to the on-premises DNS IPs (VPN or TGW). The wrapper does not create VPN or TGW routes. Inbound and outbound ENIs must sit on private subnets that already have those routes.
  - ⚠️ **Two AZs**: A resolver endpoint requires at least two IP addresses in different Availability Zones (`subnet_ids` of length >= 2).
  - 🔒 **INBOUND ingress**: `ingress_cidr_blocks` is required when creating an INBOUND endpoint security group. The wrapper does not default that rule to `0.0.0.0/0`.
  - ℹ️ **vpc_parameter**: Standard Platform `modules/base` sets `vpc_parameter = module.wrapper_vpc` (full output: `vpcs`, `subnets`, `route_tables`). The workspace only sets `route53_resolver_parameters`. `vpc-01` is a wrapper map key, not an AWS VPC ID.
  - ℹ️ **Inbound vs outbound**: OUTBOUND forwards AWS queries to on-premises DNS (`rules`). INBOUND lets on-premises resolvers query AWS private hosted zones; it has no `rules`. `direction = "INBOUND"` creates the endpoint. After apply, point on-premises DNS at `resolver_endpoint_ip_addresses`.
  - ℹ️ **RAM vs endpoint**: Only FORWARD rules are shareable. Spoke VPCs use the hub outbound endpoint; they only associate the shared rule (`vpc` + `shared_rules` / `rule_associations`). An OUTBOUND endpoint is created only when `rules` is non-empty (or `create_endpoint = true`).
  - ℹ️ **Organizations**: `ram_share_with_organization = true` shares with the current organization ARN. Enable Resource Access Manager sharing with AWS Organizations in the management account so intra-org shares are auto-accepted. Use `ram_principals` for specific account IDs instead of, or in addition to, the organization. If the invite is not auto-accepted, set `accept_resource_share = true` and `ram_resource_share_arn`.
input_table: |
  | vpc | Key into `vpc_parameter.vpcs` (for example `vpc-01`). Not an AWS VPC ID. | `string` | `null` | no |
  | vpc_id | AWS VPC ID (`vpc-` + 8 or 17 hex chars). | `string` | `null` | no |
  | vpc_name | VPC `tag:Name` for `data.aws_vpc` when no ID or wrapper key resolves. | `string` | `local.default_vpc_name` | no |
  | resource_ids | Explicit AWS IDs: `{ vpc_id, subnet_ids }`. | `object` | `null` | no |
  | subnet_ids | AWS subnet IDs, wrapper keys (`private-a` → `{vpc}-private-a`), or Name tags. | `list(string)` | wrapper `*-private-*` or `data.aws_subnets` | no |
  | subnet_name | Subnet `tag:Name` glob for `data.aws_subnets` when `subnet_ids` is empty. | `string` | `"${common_name}-private*"` | no |
  | ip_addresses | Optional explicit ENI IPs (`subnet_id`, `ip`). | `list(object)` | `[]` | no |
  | direction | Resolver endpoint direction (`OUTBOUND` or `INBOUND`). | `string` | `"OUTBOUND"` | no |
  | create_endpoint | Whether to create the resolver endpoint. Defaults to `true` when `rules` is set or `direction` is `INBOUND`. | `bool` | `rules` or `INBOUND` | no |
  | create_security_group | Whether to create the endpoint security group. Defaults to the same as `create_endpoint`. | `bool` | `create_endpoint` | no |
  | security_group_ids | Additional security group IDs attached to the endpoint. | `list(string)` | `[]` | no |
  | ingress_cidr_blocks | CIDRs allowed to query an INBOUND endpoint on port 53. Required for INBOUND when a security group is created. | `list(string)` | `[]` | no |
  | egress_cidr_blocks | CIDRs the endpoint may reach on port 53. Defaults to rule target IPs. | `list(string)` | `[]` | no |
  | protocols | Resolver protocols (`Do53`, `DoH`, `DoH-FIPS`). | `list(string)` | `null` | no |
  | resolver_endpoint_type | Endpoint IP type (`IPV4`, `IPV6`, `DUALSTACK`). | `string` | `"IPV4"` | no |
  | rules | Map of forwarding rules (`domain_name`, `target_ips`, `rule_type`). | `map` | `{}` | no |
  | associate_vpc | Associate created rules with the endpoint VPC. | `bool` | `true` | no |
  | shared_rules | Spoke shorthand: map of name → rule ID string, or `{ resolver_rule_id / resource_id / rule_name / domain_name }`. | `map` | `{}` | no |
  | rule_associations | Associations for existing or RAM-shared rules (`resolver_rule_id`, `resource_id`, `rule_name`, or `domain_name`). | `map` | `{}` | no |
  | share_rules | Share FORWARD rules through AWS RAM. Implied when `ram_share_with_organization` is true. | `bool` | `false` | no |
  | ram_share_with_organization | Share rules with this account's AWS Organization (`data.aws_organizations_organization`). | `bool` | `false` | no |
  | ram_name | RAM resource share name. | `string` | `"${local.common_name}-${each.key}-rules"` | no |
  | ram_principals | Account IDs, Organization ARNs, or OU ARNs. Combined with the org ARN when `ram_share_with_organization` is true. | `list(string)` | `[]` | no |
  | ram_allow_external_principals | Allow principals outside the organization. | `bool` | `false` | no |
  | ram_resource_share_arn | Existing RAM share ARN (producer reuse or consumer accept). | `string` | `null` | no |
  | accept_resource_share | Consumer: accept `ram_resource_share_arn` before associating shared rules. | `bool` | `false` | no |
  | tags | Additional tags merged into resolver and RAM resources. | `map(string)` | `{}` | no |
