module_name: "Terraform Route53 Resolver Module"
module_description: |
  The Terraform Wrapper for Route 53 Resolver provisions outbound and inbound resolver endpoints, forwarding rules toward on-premises DNS, VPC associations, and AWS RAM shares so other accounts and VPCs can resolve those domains. Place it in the Base / networking layer next to the VPC, Transit Gateway, and Site-to-Site VPN wrappers. Use an OUTBOUND endpoint so AWS resolves on-premises domains over VPN; use an INBOUND endpoint so on-premises resolvers query AWS private hosted zones through the same path. Endpoint subnets must already route to the target DNS IPs.
module_badges:
  - url: "https://github.com/gocloudLa/terraform-aws-wrapper-route53-resolver/releases/latest"
    image: "https://img.shields.io/github/v/release/gocloudLa/terraform-aws-wrapper-route53-resolver.svg?style=for-the-badge"
    alt: "Latest Release"
  - url: ""
